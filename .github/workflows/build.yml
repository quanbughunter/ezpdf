# Builds and checks ezPDF on GitHub's machines, which have every toolchain:
#   web      unit + browser tests (dev and production build), web app artifact
#   pages    publishes that tested web app at https://quanbughunter.github.io/ezpdf/
#            (pushes to main only; needs Settings → Pages → Source: GitHub Actions)
#   windows  Tauri installers (.msi and setup .exe), cargo test
#   android  debug APK (Capacitor 8, Gradle)
# Nothing here uploads documents: the tests use the fixtures in tests/.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Ubuntu 24.04's own Python refuses system-wide pip installs (PEP 668)
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: PDF tools used by the checks
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf
          pip install pymupdf pikepdf pillow numpy scipy
      - run: npm run build
      - run: npm run test:layout && npm run test:engine && npm run verify && npm run test:m3 && npm run test:storage && npm run test:edit
      - run: npm run e2e && npm run e2e:m3 && npm run e2e:m4 && npm run e2e:edit && npm run e2e:scan && npm run e2e:share
      - name: production build in the browser
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 3
          npm run e2e:preview && npm run e2e:m3:preview && npm run e2e:m4:preview && npm run e2e:edit:preview && npm run e2e:scan:preview && npm run e2e:share:preview
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: web-app, path: dist }
      # the same build the tests above passed on, for the pages job
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with: { path: dist }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-output, path: out, retention-days: 7 }

  pages:
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency: { group: pages, cancel-in-progress: false }
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: cargo test --lib
        working-directory: src-tauri
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ezpdf-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # The runner image already has the Android SDK (ANDROID_HOME) with licences
      # accepted; android-actions/setup-android@v3 breaks on cmdline-tools 16
      # (it asks for the removed 'tools' package). Gradle fetches what is missing.
      - run: npm ci
      - run: npm run build:android
      # the executable bit is lost when the project comes from Windows
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: ezpdf-android-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
