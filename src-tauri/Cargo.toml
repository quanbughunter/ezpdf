[package]
name = "ezpdf"
version = "0.6.2"
description = "ezPDF: đọc, ghi chú, ký và xuất PDF trên máy"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "ezpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.5"

# Sharing on Windows: the clipboard (CF_HDROP) and the share window
# (DataTransferManager). Same windows-rs release as Tauri's own.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Foundation_Collections",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
] }
windows-collections = "0.3"
windows-future = "0.3"

[profile.release]
strip = true
