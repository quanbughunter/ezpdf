<!doctype html>
<html lang="vi">
  <head><meta charset="UTF-8" /><title>pdf.js independent render</title>
  <style>body{margin:0;background:#ddd;font:12px sans-serif} canvas{display:block;margin:8px;background:#fff;box-shadow:0 1px 3px #0003}</style></head>
  <body>
    <input type="file" id="f" accept="application/pdf" />
    <div id="out"></div>
    <script type="module">
      import * as pdfjs from 'pdfjs-dist';
      import workerUrl from 'pdfjs-dist/build/pdf.worker.mjs?url';
      pdfjs.GlobalWorkerOptions.workerSrc = workerUrl;
      document.getElementById('f').onchange = async (e) => {
        const data = new Uint8Array(await e.target.files[0].arrayBuffer());
        const doc = await pdfjs.getDocument({ data }).promise;
        const result = { pages: [] };
        for (let i = 1; i <= doc.numPages; i++) {
          const page = await doc.getPage(i);
          const vp = page.getViewport({ scale: 1.25 });
          const c = document.createElement('canvas');
          c.width = vp.width; c.height = vp.height; c.dataset.page = i;
          document.getElementById('out').appendChild(c);
          await page.render({ canvas: c, viewport: vp }).promise;
          const annots = await page.getAnnotations();
          result.pages.push(annots.map((a) => ({ subtype: a.subtype, rect: a.rect, contents: a.contentsObj?.str, hasAppearance: a.hasAppearance })));
        }
        window.__pdfjsResult = result;
      };
    </script>
  </body>
</html>
